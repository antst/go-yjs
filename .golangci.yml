version: "2"

# Adapted from the file-service config. Every linter listed below reports ZERO
# issues on this repository — nothing here is enabled and then excluded. There is
# no `exclusions` section, and there are no nolint directives in the tree.
#
# Adopting it took 350-odd code fixes rather than configuration, and the ones
# worth knowing about are recorded in the commit that introduced this file. Four
# linters from the source config are deliberately NOT enabled; each is recorded
# with its finding count in docs/LIBRARY-GAPS.md rather than silenced here,
# because a rule you exclude everywhere is a rule you have not adopted.

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - errorlint         # Catches direct error comparisons that fail on wrapped errors
    - govet
    - ineffassign
    - staticcheck      # Includes stylecheck rules for error strings
    - unused
    - bodyclose
    - misspell
    - unconvert
    - unparam
    - revive
    - gocritic
    - prealloc
    - whitespace
  settings:
    staticcheck:
      checks:
        - "all"         # Enable all rules including ST1020 (comment format)
    revive:
      enable-all-rules: false
      # Only the rules this tree satisfies. `exported`, `unused-parameter` and
      # `bool-literal-in-expr` are covered in docs/LIBRARY-GAPS.md with counts
      # and the reason each is open.
      rules:
        - name: package-comments
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: defer
        - name: constant-logical-expr
        - name: atomic
        - name: error-strings    # Error strings should not be capitalized or end with punctuation
  exclusions:
    presets: []  # No default exclusions - we want all linter warnings

formatters:
  enable:
    - gofmt
    - goimports       # Checks import sorting
  settings:
    goimports:
      local-prefixes:
        - github.com/antst/go-yjs

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
